<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube No Ads</title>
    <meta name="description" content="Watch YouTube videos ad-free in a lightweight responsive feed client.">
    <meta property="og:title" content="YouTube No Ads">
    <meta property="og:description" content="Watch YouTube videos ad-free in a lightweight responsive feed client.">
    <meta name="theme-color" content="#a78bfa" />
    <link rel="icon" type="image/svg+xml" href="./javascript.svg" />
    <link rel="apple-touch-icon" href="./icons/manifest-icon-192.maskable.png" />
    <link rel="manifest" href="./manifest.json" />
    <script type="module" src="./src/main.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-color: #a78bfa;
            --accent-gradient: linear-gradient(135deg, #a78bfa 0%, #818cf8 100%);
            --shadow-color: rgba(0, 0, 0, 0.4);
            --textarea-bg: rgba(17, 24, 39, 0.9);
            --btn-bg: rgba(255, 255, 255, 0.06);
            --btn-hover: rgba(255, 255, 255, 0.12);
            font-size: 16px;
            line-height: 1.5;
        }

        @media (prefers-color-scheme: light) {
            :root:not([data-theme="dark"]) {
                --bg-color: #f3f4f6;
                --card-bg: rgba(255, 255, 255, 0.85);
                --border-color: rgba(0, 0, 0, 0.08);
                --text-color: #1f2937;
                --text-muted: #4b5563;
                --accent-color: #6d28d9;
                --accent-gradient: linear-gradient(135deg, #6d28d9 0%, #4f46e5 100%);
                --shadow-color: rgba(0, 0, 0, 0.08);
                --textarea-bg: rgba(255, 255, 255, 0.95);
                --btn-bg: rgba(0, 0, 0, 0.05);
                --btn-hover: rgba(0, 0, 0, 0.1);
            }
        }

        :root[data-theme="light"] {
            --bg-color: #f3f4f6;
            --card-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(0, 0, 0, 0.08);
            --text-color: #1f2937;
            --text-muted: #4b5563;
            --accent-color: #6d28d9;
            --accent-gradient: linear-gradient(135deg, #6d28d9 0%, #4f46e5 100%);
            --shadow-color: rgba(0, 0, 0, 0.08);
            --textarea-bg: rgba(255, 255, 255, 0.95);
            --btn-bg: rgba(0, 0, 0, 0.05);
            --btn-hover: rgba(0, 0, 0, 0.1);
        }

        :root[data-theme="dark"] {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-color: #a78bfa;
            --accent-gradient: linear-gradient(135deg, #a78bfa 0%, #818cf8 100%);
            --shadow-color: rgba(0, 0, 0, 0.4);
            --textarea-bg: rgba(17, 24, 39, 0.9);
            --btn-bg: rgba(255, 255, 255, 0.06);
            --btn-hover: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 2rem 1.25rem;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .app-header {
            text-align: center;
            margin-bottom: 0.25rem;
            position: relative;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            position: relative;
        }

        .app-title {
            font-size: 2.25rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.025em;
        }

        .theme-toggle-btn {
            background: var(--btn-bg);
            border: 1px solid var(--border-color);
            border-radius: 9999px;
            color: var(--text-color);
            padding: 0.4rem 0.6rem;
            cursor: pointer;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .theme-toggle-btn:hover {
            background: var(--btn-hover);
            transform: scale(1.05);
        }

        .app-subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            max-width: 550px;
            margin: 0.5rem auto 0;
        }

        .app-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .toolbar-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-tool {
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 0.45rem 0.85rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
        }

        .btn-tool:hover {
            background-color: var(--btn-hover);
            border-color: var(--accent-color);
            transform: translateY(-1px);
        }

        .feed-status {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        textarea {
            width: 100%;
            height: 9rem;
            background-color: var(--textarea-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-color);
            font-family: inherit;
            font-size: 0.95rem;
            padding: 1rem;
            resize: vertical;
            outline: none;
            box-shadow: 0 4px 6px -1px var(--shadow-color), 0 2px 4px -1px var(--shadow-color);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.25);
        }

        #video-container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            margin-top: 0.5rem;
        }

        .video-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.25rem;
            box-shadow: 0 10px 15px -3px var(--shadow-color), 0 4px 6px -2px var(--shadow-color);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .video-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px var(--shadow-color), 0 10px 10px -5px var(--shadow-color);
        }

        .video-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .video-link {
            color: var(--accent-color);
            font-size: 0.9rem;
            text-decoration: none;
            font-weight: 500;
            word-break: break-all;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            transition: opacity 0.2s ease;
        }

        .video-link:hover {
            text-decoration: underline;
            opacity: 0.9;
        }

        .video-card-actions {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .card-btn {
            background: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            border-radius: 6px;
            padding: 0.35rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
            text-decoration: none;
        }

        .card-btn:hover {
            background: var(--btn-hover);
            color: var(--text-color);
            transform: translateY(-1px);
        }

        .card-btn.copied {
            color: #10b981;
            border-color: #10b981;
        }

        .card-btn-remove:hover {
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.4);
        }

        .iframe-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            border-radius: 12px;
            overflow: hidden;
            background-color: #000;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .empty-state-card {
            background-color: var(--card-bg);
            border: 1px dashed var(--border-color);
            border-radius: 16px;
            padding: 3rem 1.5rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        .empty-state-icon {
            font-size: 2.5rem;
            margin-bottom: 0.25rem;
        }

        .empty-state-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .empty-state-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            max-width: 480px;
        }

        .empty-state-examples {
            color: var(--text-muted);
            font-size: 0.85rem;
            background: var(--btn-bg);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            margin-top: 0.25rem;
        }

        .btn-action.btn-sample {
            margin-top: 0.5rem;
            background: var(--accent-gradient);
            color: #ffffff;
            border: 0;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0.6rem 1.2rem;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.15s ease;
        }

        .btn-action.btn-sample:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }
    </style>
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-top">
                <h1 class="app-title">YouTube No Ads</h1>
                <button id="btnThemeToggle" class="theme-toggle-btn" title="Toggle theme (Auto / Dark / Light)" aria-label="Toggle theme">
                    <span id="themeIcon">🌓</span>
                </button>
            </div>
            <p class="app-subtitle">Paste one or more YouTube watch URLs or share links below (one per line) to load them in an ad-free player feed.</p>
        </header>

        <div class="app-toolbar">
            <div class="toolbar-actions">
                <button id="btnPaste" class="btn-tool" title="Paste from clipboard">
                    <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/><path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/></svg>
                    Paste
                </button>
                <button id="btnClear" class="btn-tool" title="Clear all links">
                    <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5Zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5Zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6Z"/><path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1ZM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118ZM2.5 3h11V2h-11v1Z"/></svg>
                    Clear
                </button>
                <button id="btnSample" class="btn-tool" title="Load sample demo videos">
                    <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/><path d="M6.271 5.055a.5.5 0 0 1 .52.038l3.5 2.5a.5.5 0 0 1 0 .814l-3.5 2.5A.5.5 0 0 1 6 10.5v-5a.5.5 0 0 1 .271-.445z"/></svg>
                    Sample
                </button>
            </div>
            <div id="feedStatus" class="feed-status" aria-live="polite"></div>
        </div>

        <textarea id="txtVideoUrls" placeholder="Paste YouTube links here...&#10;e.g., https://www.youtube.com/watch?v=dQw4w9WgXcQ" spellcheck="false" autofocus></textarea>
        
        <div id="video-container"></div>
    </div>
</body>

</html>
